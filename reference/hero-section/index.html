<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketeam — Unlock Top Marketing Talent</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@600;700&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="site-header anim-fade-down">
    <div class="header-inner">
      <div class="header-left">
        <img
          class="logo"
          src="https://polo-pecan-73837341.figma.site/_assets/v11/17ae538989a509947a8de3892c644664895e69b1.png"
          alt="Marketeam"
          height="32"
        />
        <nav class="main-nav" aria-label="Primary">
          <a href="#" class="nav-link">Your Team</a>
          <a href="#" class="nav-link">Solutions</a>
          <a href="#" class="nav-link">Blog</a>
          <a href="#" class="nav-link">Pricing</a>
        </nav>
      </div>

      <div class="header-right">
        <a href="#" class="nav-link nav-link-white">Log In</a>
        <div class="btn-border-wrap">
          <button type="button" class="btn-pill btn-join">
            <span class="btn-label">Join Now</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="hero-left anim-fade-up">
      <h1 class="typewriter-heading" id="typewriter" aria-label="Unlock Top Marketing Talent You Thought Was Out of Reach -- Now Just One Click Away!"></h1>

      <div class="btn-border-wrap start-project-wrap" id="start-project-wrap">
        <button type="button" class="btn-pill btn-start" id="start-project-btn">
          <span class="btn-label">
            Start Project
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </span>
        </button>
      </div>

      <div class="cursor-tag" id="cursor-tag">
        <svg class="cursor-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#A068FF" d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>
        </svg>
        <span class="cursor-name">David</span>
      </div>
    </div>

    <div class="hero-right anim-scale-in">
      <div class="circles-stage" id="circles-stage">
        <div class="circles">

          <div class="orbit orbit-4">
            <div class="avatar-slot" style="--angle:30deg; --radius:399px;">
              <div class="avatar-counter-spin counter-spin-4">
                <img class="avatar avatar-58 avatar-round glow-purple fly-in" style="animation-delay:1.7s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/c76d8a0b99676de31c014344bfaf75bad090758d.png" alt="" />
              </div>
            </div>
            <div class="avatar-slot" style="--angle:95deg; --radius:399px;">
              <div class="avatar-counter-spin counter-spin-4">
                <img class="avatar avatar-88 avatar-square-24 glow-orange fly-in" style="animation-delay:1.9s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/7b1b5f039de7b54cc9913e96c1923c3b15a157fa.png" alt="" />
              </div>
            </div>
            <div class="avatar-slot" style="--angle:220deg; --radius:399px;">
              <div class="avatar-counter-spin counter-spin-4">
                <img class="avatar avatar-88 avatar-square-24 glow-pink fly-in" style="animation-delay:2.1s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/9ae171d8895199349755c43fbff00e122221a027.png" alt="" />
              </div>
            </div>
            <div class="avatar-slot" style="--angle:320deg; --radius:399px;">
              <div class="avatar-counter-spin counter-spin-4">
                <img class="avatar avatar-58 avatar-round glow-purple fly-in" style="animation-delay:2.3s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/926c9eb7b4bc1df846fa0e39f0b0dc3fefd80671.png" alt="" />
              </div>
            </div>
          </div>

          <div class="orbit orbit-3">
            <div class="avatar-slot" style="--angle:130deg; --radius:325px;">
              <div class="avatar-counter-spin counter-spin-3">
                <img class="avatar avatar-88 avatar-round glow-pink fly-in" style="animation-delay:1.5s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/018736aa5d0275c4ce56cfebaf2ae3007d81ca1e.png" alt="" />
              </div>
            </div>
          </div>

          <div class="orbit orbit-2">
            <div class="avatar-slot" style="--angle:60deg; --radius:251px;">
              <div class="avatar-counter-spin counter-spin-2">
                <img class="avatar avatar-58 avatar-round glow-yellow fly-in" style="animation-delay:0.8s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/ca755f7f93c1126fb8bdbf99ab364a33aa9ab272.png" alt="" />
              </div>
            </div>
            <div class="avatar-slot" style="--angle:180deg; --radius:251px;">
              <div class="avatar-counter-spin counter-spin-2">
                <img class="avatar avatar-78 avatar-round glow-pink fly-in" style="animation-delay:1.0s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/dc01064c7093dcc32674876ee3cf5e41c4a485c6.png" alt="" />
              </div>
            </div>
            <div class="avatar-slot" style="--angle:300deg; --radius:251px;">
              <div class="avatar-counter-spin counter-spin-2">
                <img class="avatar avatar-58 avatar-square-20 glow-blue fly-in" style="animation-delay:1.2s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/d5470a58b02388336141575048720f19a50de832.png" alt="" />
              </div>
            </div>
          </div>

          <div class="orbit orbit-1">
            <div class="center-content">
              <div class="counter-spin-1">
                <span class="count-number" id="count-number">0</span>
                <span class="count-label">Specialists</span>
              </div>
            </div>
            <div class="avatar-slot" style="--angle:270deg; --radius:177px;">
              <div class="avatar-counter-spin counter-spin-1">
                <img class="avatar avatar-58 avatar-square-20 glow-purple fly-in" style="animation-delay:0.6s"
                  src="https://polo-pecan-73837341.figma.site/_assets/v11/aa51718fb3af3637e6d666b6543fc27a175fada6.png" alt="" />
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <section class="logo-ticker-section anim-fade-up-delayed" aria-label="Trusted by">
    <div class="ticker-mask">
      <div class="ticker-track" id="ticker-track"></div>
    </div>
  </section>

</div>

<script src="script.js" defer></script>
</body>
</html>
